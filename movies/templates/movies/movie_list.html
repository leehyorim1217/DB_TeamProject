<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>영화 목록</title>
</head>
<body>
    <h1>인기 영화 리스트</h1>
    <p>전체 영화 수: {{ total_count }}</p>  <!-- 전체 영화 수 출력 -->
    <ul>
        {% for movie in movies %}
            <li>{{ movie.title }} ({{ movie.release_date }})</li>
        {% empty %}
            <li>영화가 없습니다.</li>
        {% endfor %}
    </ul>
</body>
</html>
